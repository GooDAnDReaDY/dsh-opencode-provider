openapi: 3.1.0
info:
  title: OpenCode Provider Host API
  version: 0.5.43
  description: Host HTTP endpoints provided by @goodandready/dsh-opencode-provider for DSH client settings and telemetry.

servers:
  - url: http://127.0.0.1:3005
    description: Local DSH instance

components:
  securitySchemes:
    AdminTokenHeader:
      type: apiKey
      in: header
      name: x-dsh-admin-token
    AdminTokenQuery:
      type: apiKey
      in: query
      name: token
    AdminTokenLegacy:
      type: apiKey
      in: header
      name: x-opencode-token

  schemas:
    ErrorResponse:
      type: object
      required:
        - error
        - code
      properties:
        error:
          type: string
          description: Human-readable error message.
        code:
          type: string
          description: Standardized machine-readable error code.
          enum:
            - BAD_REQUEST
            - UNAUTHORIZED
            - ADMIN_TOKEN_REQUIRED
            - FORBIDDEN
            - NOT_FOUND
            - METHOD_NOT_ALLOWED
            - SETTINGS_CONFLICT
            - CONFLICT
            - PAYLOAD_TOO_LARGE
            - UNSUPPORTED_MEDIA_TYPE
            - SERVICE_UNAVAILABLE
            - INTERNAL_ERROR
        authRequired:
          type: boolean
          description: Set to true if an admin token is required.

    SuccessResponse:
      type: object
      required:
        - ok
      properties:
        ok:
          type: boolean
          example: true

    HostState:
      type: object
      required:
        - config
        - accounts
        - models
        - ready
        - revision
      properties:
        config:
          type: object
        accounts:
          type: array
          items:
            type: object
        models:
          type: array
          items:
            type: object
        ready:
          type: boolean
        revision:
          type: integer
        usage:
          type: object
          nullable: true

    RoutingNotices:
      type: object
      required:
        - events
      properties:
        enabled:
          type: boolean
        events:
          type: array
          items:
            type: object

    AnalyticsReport:
      type: object
      required:
        - windowDays
        - generatedAt
        - models
        - totals
      properties:
        windowDays:
          type: integer
        generatedAt:
          type: integer
        models:
          type: array
          items:
            type: object
        totals:
          type: object

paths:
  /dsh-opencode/state:
    get:
      summary: Retrieve full plugin state and configuration
      security:
        - AdminTokenHeader: []
        - AdminTokenQuery: []
        - AdminTokenLegacy: []
      responses:
        '200':
          description: Current plugin configuration and state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HostState'
        '401':
          description: Admin token missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Non-local host or cross-origin access refused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: Method not allowed (GET required).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /dsh-opencode/notices:
    get:
      summary: Query ambient account switch and fallback events
      security:
        - AdminTokenHeader: []
        - AdminTokenQuery: []
      responses:
        '200':
          description: List of recent routing switch events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutingNotices'
        '401':
          $ref: '#/paths/~1dsh-opencode~1state/get/responses/401'
        '403':
          $ref: '#/paths/~1dsh-opencode~1state/get/responses/403'

  /dsh-opencode/health:
    get:
      summary: Plugin health and provider registration status
      security:
        - AdminTokenHeader: []
      responses:
        '200':
          description: Health check details.
        '401':
          $ref: '#/paths/~1dsh-opencode~1state/get/responses/401'

  /dsh-opencode/analytics:
    get:
      summary: Aggregated token usage and cost analytics
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            default: 7
      security:
        - AdminTokenHeader: []
      responses:
        '200':
          description: Analytics summary and heatmap data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyticsReport'

  /dsh-opencode/config:
    post:
      summary: Mutate plugin configuration with compare-and-swap
      security:
        - AdminTokenHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                patch:
                  type: object
                revision:
                  type: integer
      responses:
        '200':
          description: Configuration successfully updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          description: Invalid request body or unknown fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Settings revision conflict (concurrent modification).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /dsh-opencode/key:
    post:
      summary: Save API key into durable credentials
      security:
        - AdminTokenHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                ref:
                  type: string
                key:
                  type: string
      responses:
        '200':
          description: Key securely stored.

  /dsh-opencode/key/clear:
    post:
      summary: Remove stored API key from credentials
      security:
        - AdminTokenHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ref:
                  type: string
      responses:
        '200':
          description: Key cleared.

  /dsh-opencode/proxy-password:
    post:
      summary: Save HTTP proxy password securely
      security:
        - AdminTokenHeader: []
      responses:
        '200':
          description: Password saved.

  /dsh-opencode/proxy-password/clear:
    post:
      summary: Clear HTTP proxy password
      security:
        - AdminTokenHeader: []
      responses:
        '200':
          description: Password cleared.

  /dsh-opencode/auth-import:
    post:
      summary: Import credentials from local OpenCode CLI auth.json
      security:
        - AdminTokenHeader: []
      responses:
        '200':
          description: Imported auth entry details.

  /dsh-opencode/refresh:
    post:
      summary: Flush and invalidate quota cache
      security:
        - AdminTokenHeader: []
      responses:
        '200':
          description: Usage refreshed.

  /dsh-opencode/accounts/check:
    post:
      summary: Validate all configured accounts against the inference API
      security:
        - AdminTokenHeader: []
      responses:
        '200':
          description: Validation result per account.

  /dsh-opencode/models/refresh:
    post:
      summary: Refresh live model catalog from inference upstream
      security:
        - AdminTokenHeader: []
      responses:
        '200':
          description: Refreshed model inventory.

  /dsh-opencode/test:
    post:
      summary: Perform minimal inference test on a model
      security:
        - AdminTokenHeader: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                model:
                  type: string
                provider:
                  type: string
      responses:
        '200':
          description: Test execution result.
